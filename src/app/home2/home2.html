<div class="home-container">

    <div class="hero-card">

        <h1>Gaming Console</h1>

        <div class="accent-line"></div>

        <p class="subtitle">
            A platform where players can discover games, connect with others, and compete together.
        </p>

        <div class="button-group">
            <button class="login-btn" (click)="login()">Login</button>
            <button class="register-btn" (click)="register()">Register</button>
        </div>

    </div>

    <div class="features">

        <div class="feature-card">
            <h2>Play</h2>
            <p>Explore exciting games and discover new challenges.</p>
        </div>

        <div class="feature-card">
            <h2>Connect</h2>
            <p>Meet gamers, build teams, and stay connected.</p>
        </div>

        <div class="feature-card">
            <h2>Compete</h2>
            <p>Join events and challenge players from around the world.</p>
        </div>

    </div>

</div>

<div class="registration-container">

    <div class="registration-card">

        <button class="back-btn" (click)="goHome()">←</button>

        <h1>Create Account</h1>
        <p class="subtitle">Join us today</p>

        <form [formGroup]="registrationForm" (ngSubmit)="submit()">

            <label>Full Name</label>
            <input type="text" formControlName="name" placeholder="Enter your full name">
            <div *ngIf="registrationForm.get('name')?.touched && registrationForm.get('name')?.invalid" class="error">Name is required.</div>

            <label>Email Address</label>
            <input type="email" formControlName="email" placeholder="example@gmail.com">
            <div *ngIf="registrationForm.get('email')?.touched && registrationForm.get('email')?.invalid" class="error">
                <div *ngIf="registrationForm.get('email')?.errors?.['required']">Email is required.</div>
                <div *ngIf="registrationForm.get('email')?.errors?.['email']">Enter a valid email.</div>
            </div>

            <label>Password</label>
            <input type="password" formControlName="password" placeholder="Create password">
            <div *ngIf="registrationForm.get('password')?.touched && registrationForm.get('password')?.invalid" class="error">
                <div *ngIf="registrationForm.get('password')?.errors?.['required']">Password is required.</div>
                <div *ngIf="registrationForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</div>
            </div>

            <label>Confirm Password</label>
            <input type="password" formControlName="confirmPassword" placeholder="Confirm password">
            <div *ngIf="registrationForm.errors?.['passwordMismatch'] && registrationForm.get('confirmPassword')?.touched" class="error">
                Passwords do not match.
            </div>

            <button class="registration-btn" type="submit">Register</button>

        </form>

        <p class="login-text">
            Already have an account?
            <a routerLink="/login">Login</a>
        </p>

    </div>

</div>

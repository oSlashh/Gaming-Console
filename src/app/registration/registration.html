<div class="registration-container">

    <div class="registration-card">

        <button class="back-btn" (click)="goHome()">
        ←
        </button>

        <h1>Create Account</h1>
        <p class="subtitle">Join us today</p>

        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" placeholder="Enter your full name">

        <label>Email Address</label>
        <input
            type="email"
            [(ngModel)]="email"
            placeholder="example@gmail.com"
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">

        <label>Password</label>
        <input type="password" [(ngModel)]="password" placeholder="Create password">

        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm password">

        <button class="registration-btn" (click)="submit()">Register</button>

        <p class="login-text">
            Already have an account?
            <a routerLink="/login">Login</a>
        </p>

    </div>

</div>

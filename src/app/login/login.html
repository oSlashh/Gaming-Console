<div
  class="login-world"
  [class.portal-active]="portalActivating"
  (pointermove)="trackPointer($event)"
  (pointerleave)="releasePointer()"
>
  <canvas
    #particleCanvas
    class="particle-canvas"
    aria-hidden="true"
  ></canvas>

  <div class="nebula-drift"></div>
  <div class="space-overlay"></div>

  <div class="portal-scene">
    <div class="portal-wrapper">
      <img class="portal-outer" src="/portal.png" alt="" />

      <div class="portal-core"></div>

      <img class="portal-inner" src="/portal.png" alt="" />

      <div class="portal-glow"></div>
      <div class="portal-vortex"></div>
      <div class="portal-shockwave"></div>

      <div class="portal-content">
        <h1 class="portal-title">Door To Nexus</h1>

        <p class="portal-subtitle">
          Enter your credentials to access the realm
        </p>

        <form
          [formGroup]="loginForm"
          (ngSubmit)="login()"
          class="portal-form"
        >
          <label class="input-shell">
            <span>Email</span>
            <input
              type="email"
              placeholder="traveler@gmail.com"
              formControlName="email"
              class="portal-input"
            />
          </label>

          <label class="input-shell">
            <span>Password</span>
            <input
              type="password"
              placeholder="Access key"
              formControlName="password"
              class="portal-input"
            />
          </label>

          <button
            type="submit"
            class="enter-btn"
            [disabled]="portalActivating"
          >
            <span>{{ portalActivating ? 'OPENING RIFT' : 'ENTER NEXUS' }}</span>
          </button>
        </form>

        <div class="register-section">
          New traveler?
          <a routerLink="/register">Create Account</a>
        </div>
      </div>
    </div>

    <img
      class="floating-island"
      src="/floating-island.png"
      alt="Floating island"
    />
  </div>

  <button
    class="back-btn"
    (click)="goHome()"
    type="button"
  >
    <span aria-hidden="true">&larr;</span>
    Back
  </button>
</div>
